name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'      # minimum supported, and the pinned environment: carries the numeric assertions
          - '1'         # latest stable, resolved from scratch: carries the API-drift check
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Prepare ChemistryLab sensitivity correction
        run: julia scripts/prepare_chemistrylab.jl
      - uses: julia-actions/julia-buildpkg@v1

      # The numeric assertions live in one pinned environment, and nowhere else. Twice in
      # two days a regression tolerance set from a CI measurement was invalidated by the
      # next run, each time with an unrelated package as the only difference in the
      # resolved manifest: DispatchDoctor and DomainSets on the chloride signature,
      # GeometryBasics on the drying one. `test/Manifest.toml` is therefore committed, and
      # `allow_reresolve: false` makes the pin fail loudly rather than drift silently.
      - name: Test the pinned environment — every group
        if: matrix.version == '1.12'
        uses: julia-actions/julia-runtest@v1
        with:
          allow_reresolve: false

      # The moving Julia keeps resolving from scratch, which is what catches an unbounded
      # dependency whose API moved under us — it is how the MeanFieldHomogenization drift
      # was found. It must not also carry the numeric assertions, so it runs every group
      # but `regression`. The examples are still executed on every push by the
      # Documentation workflow, so a broken example is still caught here.
      - name: Drop the pin on the moving Julia
        if: matrix.version == '1'
        shell: bash
        run: rm -f test/Manifest.toml
      - name: Test the freshly resolved environment — no numeric assertions
        if: matrix.version == '1'
        uses: julia-actions/julia-runtest@v1
        with:
          test_args: 'core validation chemistry'

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
