name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    #needs: test
    runs-on: ubuntu-latest
    permissions:
        actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
        pull-requests: read
        contents: write
        statuses: write
    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # MeanFieldHomogenization depends on TensND, which depends on SymPy.jl.
      # SymPy is therefore resolved into docs/Manifest.toml, which makes
      # MeanFieldHomogenizationSymPyExt a *triggered* extension: Julia
      # precompiles it on `using MeanFieldHomogenization`, and PyCall needs a
      # Python interpreter that can import sympy for that to succeed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provide sympy to PyCall
        run: python -m pip install --upgrade sympy
      - name: Install dependencies
        shell: julia --project=docs/ --color=yes {0}
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.build("PyCall")
      - name: Build and deploy
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
