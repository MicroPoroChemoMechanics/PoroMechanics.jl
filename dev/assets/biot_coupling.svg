<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title description">
<title id="title">Two fields, one coupled problem</title><desc id="description">Solid deformation changes fluid storage. Pore pressure contributes to stress. Pressure gradients cause Darcy flow, which changes storage. Backward Euler solves both fields together.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#216baf"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c65a24"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536879"/></marker>
</defs>
<rect x="1" y="1" width="998" height="548" rx="10" fill="#ffffff" stroke="#ccd8e1"/>
<text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#193047" text-anchor="start" font-weight="bold">Two fields, one coupled problem</text>
<text x="32" y="77" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#536879" text-anchor="start" font-weight="normal">A local undrained compression raises pressure; drainage then redistributes water.</text>
<rect x="40" y="133" width="340" height="216" rx="10" fill="#fff3e5" stroke="#c65a24"/>
<rect x="620" y="133" width="340" height="216" rx="10" fill="#eaf3fb" stroke="#216baf"/>
<text x="210" y="170" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c65a24" text-anchor="middle" font-weight="bold">SOLID DEFORMATION</text>
<text x="210" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#193047" text-anchor="middle" font-weight="normal">Displacement u [m]</text>
<text x="210" y="252" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#193047" text-anchor="middle" font-weight="normal">Volume strain εᵥ = div u</text>
<text x="210" y="306" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#193047" text-anchor="middle" font-weight="normal">Force balance: div σ = 0</text>
<text x="790" y="170" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#216baf" text-anchor="middle" font-weight="bold">PORE WATER</text>
<text x="790" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#193047" text-anchor="middle" font-weight="normal">Pressure p [Pa]</text>
<text x="790" y="252" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#193047" text-anchor="middle" font-weight="normal">Fluid content ζ = b εᵥ + Np</text>
<text x="790" y="306" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#193047" text-anchor="middle" font-weight="normal">Darcy flow: q = −(k/μₗ) ∇p</text>
<path d="M390 200L610 200" fill="none" stroke="#c65a24" stroke-width="3" marker-end="url(#orange)"/>
<text x="500" y="185" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c65a24" text-anchor="middle" font-weight="normal">changes storage</text>
<path d="M610 281L390 281" fill="none" stroke="#216baf" stroke-width="3" marker-end="url(#blue)"/>
<text x="500" y="312" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#216baf" text-anchor="middle" font-weight="normal">changes stress</text>
<rect x="150" y="390" width="700" height="112" rx="10" fill="#e9f5f1" stroke="#19796d"/>
<text x="500" y="429" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#19796d" text-anchor="middle" font-weight="bold">At each time step: solve for u and p together</text>
<text x="500" y="470" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#193047" text-anchor="middle" font-weight="normal">(K₁ + K₂ / Δt) Xⁿ⁺¹ = F + (K₂ / Δt) Xⁿ</text>
<path d="M210 351L210 387" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#gray)"/>
<path d="M790 351L790 387" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#gray)"/>
</svg>
