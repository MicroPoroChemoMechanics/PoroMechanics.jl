<title id="title">Water enters a horizontal, unsaturated barrier</title><desc id="description">A 20 cm barrier has a sealed left end and a saturated water supply at the right. Water travels toward smaller x. The lower bar shows initial bulk fractions of solid, liquid, and gas for porosity 0.30 and saturation 0.77752.</desc>
