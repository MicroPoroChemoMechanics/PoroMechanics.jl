<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- solid grains of the porous medium -->
    <pattern id="grains" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="6.5" fill="#c9b48f"/>
      <circle cx="26" cy="14" r="7.5" fill="#bfa77e"/>
      <circle cx="12" cy="24" r="5.5" fill="#cdb995"/>
    </pattern>
    <!-- tracer that has already entered the pores -->
    <linearGradient id="front" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f7fd0" stop-opacity="0.70"/>
      <stop offset="0.35" stop-color="#2f7fd0" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#2f7fd0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#57606a" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- reservoir -->
  <rect x="40" y="80" width="110" height="140" fill="#cfe3f7" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="95" y="135" text-anchor="middle" font-size="14" fill="#1f5fa8" font-weight="bold">tracer</text>
  <text x="95" y="153" text-anchor="middle" font-size="14" fill="#1f5fa8" font-weight="bold">solution</text>
  <text x="95" y="180" text-anchor="middle" font-size="15" fill="#1f5fa8" font-style="italic">c = c<tspan dy="4" font-size="11">in</tspan></text>

  <!-- porous medium -->
  <rect x="150" y="80" width="490" height="140" fill="#f4efe6"/>
  <rect x="150" y="80" width="490" height="140" fill="url(#front)"/>
  <rect x="150" y="80" width="490" height="140" fill="url(#grains)"/>
  <rect x="150" y="80" width="490" height="140" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <!-- sealed face -->
  <rect x="640" y="80" width="16" height="140" fill="url(#hatch)" stroke="#57606a" stroke-width="1.5"/>

  <!-- diffusion arrow -->
  <line x1="170" y1="150" x2="330" y2="150" stroke="#1f5fa8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="250" y="140" text-anchor="middle" font-size="13" fill="#1f5fa8">diffusion</text>

  <!-- labels above -->
  <text x="95" y="60" text-anchor="middle" font-size="13" fill="#24292f">imposed concentration</text>
  <text x="95" y="44" text-anchor="middle" font-size="13" fill="#24292f" font-weight="bold">boundary x = 0</text>
  <text x="395" y="44" text-anchor="middle" font-size="13" fill="#24292f" font-weight="bold">saturated porous medium</text>
  <text x="395" y="62" text-anchor="middle" font-size="13" fill="#24292f">porosity φ, diffusion coefficient D, initially c = 0</text>
  <text x="680" y="44" text-anchor="middle" font-size="13" fill="#24292f" font-weight="bold">boundary x = L</text>
  <text x="680" y="62" text-anchor="middle" font-size="13" fill="#24292f">sealed: no flux</text>

  <!-- axis -->
  <line x1="150" y1="250" x2="700" y2="250" stroke="#57606a" stroke-width="1.5" marker-end="url(#dim)"/>
  <line x1="150" y1="243" x2="150" y2="257" stroke="#57606a" stroke-width="1.5"/>
  <line x1="640" y1="243" x2="640" y2="257" stroke="#57606a" stroke-width="1.5"/>
  <text x="150" y="276" text-anchor="middle" font-size="14" fill="#24292f" font-style="italic">x = 0</text>
  <text x="640" y="276" text-anchor="middle" font-size="14" fill="#24292f" font-style="italic">x = L = 1 m</text>
  <text x="712" y="255" font-size="14" fill="#24292f" font-style="italic">x</text>

  <text x="380" y="310" text-anchor="middle" font-size="13" fill="#57606a">Unknown: the concentration c(x, t) of tracer in the pore solution [mol/m³]. The blue shading is the tracer front.</text>
</svg>
