<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="449" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- control volume of node K (storage!) -->
  <rect x="260" y="110" width="120" height="80" fill="#fde8c8" stroke="#c46a00" stroke-width="1.5"/>
  <text x="272" y="130" font-size="15" fill="#9a5200" font-weight="bold" font-style="italic">ω<tspan dy="4" font-size="11">K</tspan></text>

  <!-- interfaces between control volumes -->
  <g stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="140" y1="100" x2="140" y2="200"/>
    <line x1="260" y1="100" x2="260" y2="200"/>
    <line x1="380" y1="100" x2="380" y2="200"/>
    <line x1="500" y1="100" x2="500" y2="200"/>
    <line x1="620" y1="100" x2="620" y2="200"/>
  </g>

  <!-- the domain [0, L] -->
  <line x1="80" y1="150" x2="530" y2="150" stroke="#24292f" stroke-width="2"/>
  <line x1="590" y1="150" x2="680" y2="150" stroke="#24292f" stroke-width="2"/>
  <text x="560" y="155" text-anchor="middle" font-size="18" fill="#24292f">⋯</text>

  <!-- edge K–L (flux!) and the flux through the interface σ_KL -->
  <line x1="320" y1="150" x2="440" y2="150" stroke="#1f5fa8" stroke-width="6"/>
  <line x1="362" y1="175" x2="398" y2="175" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="404" y="180" font-size="13" fill="#1f5fa8" font-style="italic">j</text>
  <text x="386" y="122" font-size="13" fill="#57606a" font-style="italic">σ<tspan dy="4" font-size="10">KL</tspan></text>

  <!-- nodes -->
  <g stroke="#24292f" stroke-width="1.5">
    <circle cx="80" cy="150" r="7" fill="#2f9e44"/>
    <circle cx="200" cy="150" r="6" fill="#ffffff"/>
    <circle cx="320" cy="150" r="7" fill="#e8890c"/>
    <circle cx="440" cy="150" r="7" fill="#ffffff"/>
    <circle cx="680" cy="150" r="7" fill="#8c959f"/>
  </g>
  <text x="80" y="95" text-anchor="middle" font-size="13" fill="#24292f">node 1</text>
  <text x="200" y="95" text-anchor="middle" font-size="13" fill="#24292f">node 2</text>
  <text x="320" y="95" text-anchor="middle" font-size="13" fill="#24292f">node K</text>
  <text x="440" y="95" text-anchor="middle" font-size="13" fill="#24292f">node L</text>
  <text x="680" y="95" text-anchor="middle" font-size="13" fill="#24292f">node N</text>
  <text x="80" y="220" text-anchor="middle" font-size="13" fill="#24292f" font-style="italic">x = 0</text>
  <text x="680" y="220" text-anchor="middle" font-size="13" fill="#24292f" font-style="italic">x = L</text>

  <!-- local numbering of the edge -->
  <text x="380" y="212" text-anchor="middle" font-size="13" fill="#1f5fa8" font-weight="bold">edge K → L</text>
  <line x1="320" y1="232" x2="320" y2="160" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="440" y1="232" x2="440" y2="160" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="312" y="247" text-anchor="middle" font-size="13" fill="#1f5fa8">edge node 1</text>
  <text x="312" y="266" text-anchor="middle" font-size="13" fill="#1f5fa8"><tspan font-family="Menlo, Consolas, monospace">u[1, 1]</tspan> = c<tspan dy="4" font-size="10">K</tspan></text>
  <text x="448" y="247" text-anchor="middle" font-size="13" fill="#1f5fa8">edge node 2</text>
  <text x="448" y="266" text-anchor="middle" font-size="13" fill="#1f5fa8"><tspan font-family="Menlo, Consolas, monospace">u[1, 2]</tspan> = c<tspan dy="4" font-size="10">L</tspan></text>

  <!-- lengths -->
  <line x1="260" y1="70" x2="378" y2="70" stroke="#57606a" stroke-width="1" marker-end="url(#a-grey)"/>
  <line x1="380" y1="70" x2="262" y2="70" stroke="#57606a" stroke-width="1" marker-end="url(#a-grey)"/>
  <text x="250" y="74" text-anchor="end" font-size="13" fill="#57606a">|ω<tspan dy="4" font-size="10">K</tspan><tspan dy="-4">| = h</tspan></text>
  <line x1="320" y1="36" x2="438" y2="36" stroke="#57606a" stroke-width="1" marker-end="url(#a-grey)"/>
  <line x1="440" y1="36" x2="322" y2="36" stroke="#57606a" stroke-width="1" marker-end="url(#a-grey)"/>
  <text x="450" y="40" font-size="13" fill="#57606a">h<tspan dy="4" font-size="10">KL</tspan><tspan dy="-4"> = h (distance between the two nodes)</tspan></text>

  <!-- three callouts -->
  <g font-size="13" fill="#24292f">
    <rect x="20" y="290" width="230" height="140" rx="6" fill="#fdf3e4" stroke="#c46a00"/>
    <text x="32" y="312" font-weight="bold" fill="#9a5200" font-family="Menlo, Consolas, monospace">storage!</text>
    <text x="32" y="332">called once per node (orange)</text>
    <text x="32" y="352"><tspan font-family="Menlo, Consolas, monospace">u[1]</tspan> = c at that node</text>
    <text x="32" y="372">returns the stored amount</text>
    <text x="32" y="392" font-family="Menlo, Consolas, monospace">f[1] = φ·c</text>
    <text x="32" y="416" fill="#57606a">solver multiplies by |ω<tspan dy="4" font-size="10">K</tspan><tspan dy="-4">|</tspan></text>

    <rect x="265" y="290" width="230" height="140" rx="6" fill="#e7f0fa" stroke="#1f5fa8"/>
    <text x="277" y="312" font-weight="bold" fill="#1f5fa8" font-family="Menlo, Consolas, monospace">flux!</text>
    <text x="277" y="332">called once per edge (blue)</text>
    <text x="277" y="352"><tspan font-family="Menlo, Consolas, monospace">u[i, j]</tspan> = species i, edge node j</text>
    <text x="277" y="372">returns the flux from 1 to 2</text>
    <text x="277" y="392" font-family="Menlo, Consolas, monospace">f[1] = D·φ·(c<tspan dy="4" font-size="10">K</tspan><tspan dy="-4"> − c</tspan><tspan dy="4" font-size="10">L</tspan><tspan dy="-4">)</tspan></text>
    <text x="277" y="416" fill="#57606a">solver divides by h<tspan dy="4" font-size="10">KL</tspan></text>

    <rect x="510" y="290" width="230" height="140" rx="6" fill="#e9f6ec" stroke="#2f9e44"/>
    <text x="522" y="312" font-weight="bold" fill="#237a35" font-family="Menlo, Consolas, monospace">bcondition!</text>
    <text x="522" y="332">called per boundary node</text>
    <text x="522" y="352">region 1 (green): c = c<tspan dy="4" font-size="10">in</tspan></text>
    <text x="522" y="372">region 2 (grey): nothing</text>
    <text x="522" y="392">imposed, hence no flux —</text>
    <text x="522" y="416" fill="#57606a">the default of the solver</text>
  </g>
</svg>
